<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Chat Knew · Overlay</title>
  <link rel="stylesheet" href="/overlay.css">
  <script src="/overlay.js" defer></script>
</head>
<body>
  <div class="canvas">
    <div class="simulation-tag" id="simulation-tag" hidden>SIMULATION</div>
    <section class="stamp" id="stamp" hidden aria-live="polite" aria-atomic="true">
      <div class="stamp-mark" aria-hidden="true" id="stamp-mark">✓</div>
      <div class="stamp-copy"><h1 id="stamp-title"></h1><p id="stamp-detail"></p></div>
      <span class="stamp-line" aria-hidden="true"></span>
    </section>
  </div>
</body>
</html>
